name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 接受 Android SDK 许可并安装 NDK/CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10962854" "cmake;3.22.1" || true

      - name: 编译 Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: qy-pet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
